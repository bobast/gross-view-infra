# External Secrets Operator (ESO) — ClusterSecretStore for HashiCorp Vault in the
# same cluster. Controller runs in namespace `external-secrets` (installed from
# the official release bundle, see AGENTS.md). Vault is provisioned
# automatically by vault/entrypoint.sh (engine `secret/` KV v2, policy
# `eso-policy`, Kubernetes auth method + role `eso-role` bound to service
# account `eso-vault-auth` in namespace `gross-view`). The controller mints a
# JWT for that SA (TokenRequest, cross-namespace) and exchanges it for a Vault
# token (TTL 1h).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gross-view-vault
spec:
  provider:
    vault:
      server: "http://vault.gross-view.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-role"
          serviceAccountRef:
            name: eso-vault-auth
            namespace: gross-view