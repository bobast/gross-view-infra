# WireGuard gateway config renderer for the vpn-gateway pod (see docs/vpn-access-k8s.md).
#
# Runs as the pod's init container: writes /config/wg_confs/wg0.conf from the
# `vpn-gateway-keys` Secret into the shared emptyDir. The linuxserver/wireguard
# container then brings the tunnel up itself (`wg-quick up`), so this script
# never touches interfaces, routes or packages.
#
# Pinned to LF in .gitattributes — a CRLF breaks the shell inside the container,
# exactly like the opencode/vault entrypoint ConfigMaps.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vpn-gateway-entrypoint
  namespace: gross-view
  labels:
    app.kubernetes.io/name: vpn-gateway
    app.kubernetes.io/part-of: gross-view
data:
  entrypoint.sh: |
    #!/bin/sh
    # Render the WireGuard config of the vpn-gateway pod. See docs/vpn-access-k8s.md.
    #
    # Key material comes from the `vpn-gateway-keys` Secret (projected as files):
    #   server_privatekey          server key (REQUIRED, created by scripts/vpn-init.sh)
    #   server_publickey           informational, used by scripts/vpn-peer.sh
    #   peer_<name>_publickey      one peer per developer (no preshared keys — PSK
    #                              was dropped, X25519 alone secures the tunnel)
    #   peer_<name>_address        AllowedIPs of that peer: a bare tunnel address
    #                              (appended /32), a full CIDR for a site-to-site
    #                              peer (e.g. 192.168.86.0/24), or a comma list
    #                              without spaces (e.g. 10.2.2.4/32,192.168.86.16/32)
    #                              — anything containing `/` is used verbatim
    #   peer_<name>_endpoint       (optional) `host:port` rendered as Endpoint —
    #                              the gateway dials THIS address for the peer
    #                              instead of waiting for its handshake (for a
    #                              peer that never initiates, e.g. a remote GW)
    #   peer_<name>_keepalive      (optional) PersistentKeepalive in seconds,
    #                              keeps the endpoint path warm through NAT
    # No key material lives in this repo. Restart the pod to pick up peer changes.
    #
    # The tunnel itself is owned by the linuxserver/wireguard image: its
    # svc-wireguard runs `wg-quick up /config/wg_confs/wg0.conf`, which also
    # installs a route for every peer AllowedIPs — including site-to-site CIDRs
    # outside the server subnet (verified live 2026-10-06). wg-quick only calls
    # sysctl/iptables for a default-route (*/0) AllowedIPs, which we never have,
    # so the pod's read-only /proc/sys is never touched.

    set -eu

    WG_IF="${WG_IF:-wg0}"
    WG_LISTEN_PORT="${WG_LISTEN_PORT:-43210}"
    WG_SERVER_ADDRESS="${WG_SERVER_ADDRESS:-10.2.2.3/24}"
    WG_MTU="${WG_MTU:-1380}"
    KEYS_DIR="${KEYS_DIR:-/run/vpn-keys}"
    CONFIG_DIR="${CONFIG_DIR:-/config/wg_confs}"
    CONFIG="$CONFIG_DIR/$WG_IF.conf"

    if [ ! -s "$KEYS_DIR/server_privatekey" ]; then
      echo "[vpn-entrypoint] FATAL: Secret vpn-gateway-keys has no server_privatekey" >&2
      echo "[vpn-entrypoint] create it first: ./scripts/vpn-init.sh" >&2
      exit 1
    fi

    mkdir -p "$CONFIG_DIR"

    {
      echo "# Generated by the vpn-gateway init container from Secret vpn-gateway-keys."
      echo "# Edit the Secret and restart the pod; do not edit this file."
      echo "[Interface]"
      echo "Address = ${WG_SERVER_ADDRESS}"
      echo "ListenPort = ${WG_LISTEN_PORT}"
      echo "MTU = ${WG_MTU}"
      echo "PrivateKey = $(cat "$KEYS_DIR/server_privatekey")"
    } > "$CONFIG"

    peer_count=0
    for pub_file in "$KEYS_DIR"/peer_*_publickey; do
      [ -e "$pub_file" ] || continue
      # Secret keys are peer_<name>_{publickey,address}: strip BOTH the
      # `peer_` prefix and the `_publickey` suffix, otherwise the address file is
      # looked up as `peer_peer_<name>_address` and the peer is silently skipped.
      name="$(basename "$pub_file" | sed 's/^peer_//; s/_publickey$//')"
      addr_file="$KEYS_DIR/peer_${name}_address"

      if [ ! -s "$addr_file" ]; then
        echo "[vpn-entrypoint]   peer '${name}': no ${name}_address key — skipped" >&2
        continue
      fi

      # AllowedIPs: a bare tunnel address gets the canonical /32, a value that
      # already carries a prefix (site-to-site peer) is used verbatim — a blind
      # /32 append would yield "192.168.86.0/24/32" and WireGuard would reject
      # the whole config.
      allowed="$(cat "$addr_file")"
      case "$allowed" in
        */*) ;;
        *) allowed="${allowed}/32" ;;
      esac

      # Optional per-peer fields: an Endpoint pins where this peer is reachable
      # (the gateway then dials it instead of waiting for an incoming handshake),
      # a PersistentKeepalive (seconds) keeps that path warm through NAT. Both
      # are rendered only when the matching Secret key exists and is non-empty.
      endpoint_file="$KEYS_DIR/peer_${name}_endpoint"
      keepalive_file="$KEYS_DIR/peer_${name}_keepalive"

      {
        echo ""
        echo "[Peer]"
        echo "# ${name} (${allowed})"
        echo "PublicKey = $(cat "$pub_file")"
        echo "AllowedIPs = ${allowed}"
        if [ -s "$endpoint_file" ]; then
          echo "Endpoint = $(cat "$endpoint_file")"
        fi
        if [ -s "$keepalive_file" ]; then
          echo "PersistentKeepalive = $(cat "$keepalive_file")"
        fi
      } >> "$CONFIG"

      peer_count=$((peer_count + 1))
    done

    chmod 600 "$CONFIG"
    echo "[vpn-entrypoint] wrote $CONFIG with ${peer_count} peer(s)"
