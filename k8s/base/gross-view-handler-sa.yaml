# gross-view-handler — ServiceAccount (Vault identity for the prod profile).
# The app authenticates to Vault with this account's Kubernetes token
# (auth/kubernetes role `gross-view-handler`, provisioned by vault/entrypoint.sh;
# policy `gross-view-handler-policy` grants read-only on
# secret/gross-view-handler-prod, from which Spring Cloud Vault reads DB_USER /
# DB_PASS — see docs/ESO-vault-k8s.md).
#
# The handler workload is the Deployment `gross-view-api`
# (k8s/base/gross-view-api-deployment.yaml), which uses this account via
# `serviceAccountName`. The account is also valid standalone: Vault's role
# declares the exact `<namespace>/<name>` it accepts, so the binding has been
# live since before the workload landed. The account needs NO cluster permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gross-view-handler
  namespace: gross-view
  labels:
    app.kubernetes.io/name: gross-view-handler
    app.kubernetes.io/part-of: gross-view
