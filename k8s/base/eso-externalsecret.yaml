# ExternalSecret that backs the `gross-view-secrets` Secret from Vault
# (KV v2 path `secret/data/gross-view`, key `gross-view`). Source of truth is
# Vault; edits made directly to the Secret are overwritten on the next sync
# (refreshInterval). Bootstrap for a fresh cluster is fully automatic: the vault
# entrypoint seeds `secret/gross-view` with dev placeholder values when the path
# is absent, and ESO owner-creates this Secret from them (no secret.yaml needed).
#
# NOTE: the key list intentionally mirrors EVERY current key of the live Secret
# (including legacy `opencode_*`/`n8n_*`/`wg_*` and `keycloak_internal_url`)
# so the ESO sync never drops a key still referenced by a workload. Prune a key
# here only after its consumer has been removed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gross-view-secrets
  namespace: gross-view
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gross-view-vault
    kind: ClusterSecretStore
  target:
    name: gross-view-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: anthropic_api_key
      remoteRef:
        key: gross-view
        property: anthropic_api_key
    - secretKey: deepseek_api_key
      remoteRef:
        key: gross-view
        property: deepseek_api_key
    - secretKey: gv_db_name
      remoteRef:
        key: gross-view
        property: gv_db_name
    - secretKey: gv_db_password
      remoteRef:
        key: gross-view
        property: gv_db_password
    - secretKey: gv_db_user
      remoteRef:
        key: gross-view
        property: gv_db_user
    - secretKey: kc_db_name
      remoteRef:
        key: gross-view
        property: kc_db_name
    - secretKey: kc_db_password
      remoteRef:
        key: gross-view
        property: kc_db_password
    - secretKey: kc_db_user
      remoteRef:
        key: gross-view
        property: kc_db_user
    - secretKey: keycloak_admin
      remoteRef:
        key: gross-view
        property: keycloak_admin
    - secretKey: keycloak_admin_password
      remoteRef:
        key: gross-view
        property: keycloak_admin_password
    - secretKey: keycloak_internal_url
      remoteRef:
        key: gross-view
        property: keycloak_internal_url
    - secretKey: n8n_db_name
      remoteRef:
        key: gross-view
        property: n8n_db_name
    - secretKey: n8n_db_password
      remoteRef:
        key: gross-view
        property: n8n_db_password
    - secretKey: n8n_db_user
      remoteRef:
        key: gross-view
        property: n8n_db_user
    - secretKey: n8n_encryption_key
      remoteRef:
        key: gross-view
        property: n8n_encryption_key
    - secretKey: opencode_agent_client_id
      remoteRef:
        key: gross-view
        property: opencode_agent_client_id
    - secretKey: opencode_agent_client_secret
      remoteRef:
        key: gross-view
        property: opencode_agent_client_secret
    - secretKey: opencode_password
      remoteRef:
        key: gross-view
        property: opencode_password
    - secretKey: opencode_server_password
      remoteRef:
        key: gross-view
        property: opencode_server_password
    - secretKey: opencode_server_username
      remoteRef:
        key: gross-view
        property: opencode_server_username
    - secretKey: postgres_db
      remoteRef:
        key: gross-view
        property: postgres_db
    - secretKey: postgres_password
      remoteRef:
        key: gross-view
        property: postgres_password
    - secretKey: postgres_user
      remoteRef:
        key: gross-view
        property: postgres_user
    - secretKey: wg_internal_subnet
      remoteRef:
        key: gross-view
        property: wg_internal_subnet
    - secretKey: wg_peer_dns
      remoteRef:
        key: gross-view
        property: wg_peer_dns
    - secretKey: wg_peers
      remoteRef:
        key: gross-view
        property: wg_peers
    - secretKey: wg_serverurl
      remoteRef:
        key: gross-view
        property: wg_serverurl