# ExternalSecret that backs the `gross-view-secrets` Secret from Vault
# (KV v2 path `secret/data/gross-view`, key `gross-view`). Source of truth is
# Vault; edits made directly to the Secret are overwritten on the next sync
# (refreshInterval). Bootstrap for a fresh cluster is fully automatic: the vault
# entrypoint seeds `secret/gross-view` with dev placeholder values when the path
# is absent, and ESO owner-creates this Secret from them (no secret.yaml needed).
#
# NOTE: the key list INTENTIONALLY mirrors the keys that are present in the live
# Vault (`secret/gross-view`). ESO fails the whole sync if even one referenced
# property is missing ("cannot find secret data for key: ..."), which is exactly
# what happened while this list still referenced 35 keys after Vault was reduced
# to 20 (2026-10-13). Keys removed from this list disappear from the Secret
# (`creationPolicy: Owner` rewrites the whole item), so only ever add a key back
# once it exists in Vault, and drop a key only together with its consumer.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gross-view-secrets
  namespace: gross-view
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gross-view-vault
    kind: ClusterSecretStore
  target:
    name: gross-view-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: anthropic_api_key
      remoteRef:
        key: gross-view
        property: anthropic_api_key
    - secretKey: deepseek_api_key
      remoteRef:
        key: gross-view
        property: deepseek_api_key
    - secretKey: gv_db_name
      remoteRef:
        key: gross-view
        property: gv_db_name
    - secretKey: gv_db_password
      remoteRef:
        key: gross-view
        property: gv_db_password
    - secretKey: gv_db_user
      remoteRef:
        key: gross-view
        property: gv_db_user
    - secretKey: kc_db_name
      remoteRef:
        key: gross-view
        property: kc_db_name
    - secretKey: kc_db_password
      remoteRef:
        key: gross-view
        property: kc_db_password
    - secretKey: kc_db_user
      remoteRef:
        key: gross-view
        property: kc_db_user
    - secretKey: keycloak_admin
      remoteRef:
        key: gross-view
        property: keycloak_admin
    - secretKey: keycloak_admin_password
      remoteRef:
        key: gross-view
        property: keycloak_admin_password
    - secretKey: keycloak_internal_url
      remoteRef:
        key: gross-view
        property: keycloak_internal_url
    - secretKey: opencode_agent_client_id
      remoteRef:
        key: gross-view
        property: opencode_agent_client_id
    - secretKey: opencode_agent_client_secret
      remoteRef:
        key: gross-view
        property: opencode_agent_client_secret
    - secretKey: opencode_password
      remoteRef:
        key: gross-view
        property: opencode_password
    - secretKey: opencode_server_password
      remoteRef:
        key: gross-view
        property: opencode_server_password
    - secretKey: opencode_server_username
      remoteRef:
        key: gross-view
        property: opencode_server_username
    - secretKey: postgres_db
      remoteRef:
        key: gross-view
        property: postgres_db
    - secretKey: postgres_password
      remoteRef:
        key: gross-view
        property: postgres_password
    - secretKey: postgres_user
      remoteRef:
        key: gross-view
        property: postgres_user
    # Dev access to Vault over the VPN: password of the `dev-policy` user
    # (docs/vpn-access-k8s.md). The login (`vault_userpass_username`) is NOT in
    # Vault yet, so it is not synced — the vault entrypoint needs both and keeps
    # userpass DISABLED until the username key is added to Vault and listed here.
    - secretKey: vault_userpass_password
      remoteRef:
        key: gross-view
        property: vault_userpass_password
