# nginx - Deployment (reverse proxy, TLS terminator for mint-box.ru).
# Mirrors the docker-compose nginx service. Certificates come from the
# `mint-box-tls` Secret (authored by the certbot CronJob); the HTTP-01 webroot
# is the shared `certbot-data` PVC so the certbot pod can write challenge files.
# Bootstrap: an initContainer generates a throwaway self-signed cert and creates
# the `mint-box-tls` Secret if it does not exist yet, so the pod starts even on
# a fresh cluster before certbot has issued a real Let's Encrypt certificate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: gross-view
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: gross-view
spec:
  replicas: 1
  # Keep no old ReplicaSets: obsolete revisions for nonexistent pods are cleaned up.
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
        app.kubernetes.io/part-of: gross-view
    spec:
      serviceAccountName: nginx
      initContainers:
        - name: tls-bootstrap-generate
          image: dockerhub.timeweb.cloud/library/alpine:3.20
          command:
            - sh
            - -c
            - |
              set -eu
              apk add --no-cache openssl >/dev/null
              openssl req -x509 -newkey rsa:2048 -nodes \
                -keyout /shared/tls.key -out /shared/tls.crt \
                -days 825 -subj "/CN=mint-box.ru" \
                -addext "subjectAltName=DNS:mint-box.ru"
          resources:
            # `apk add` needs headroom above a tight 32Mi limit (was OOMKilled).
            # Init containers exit after bootstrap, so this does not add to the
            # steady-state memory footprint of the pod.
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tls-bootstrap
              mountPath: /shared
        - name: tls-bootstrap-provider
          image: dockerhub.timeweb.cloud/lachlanevenson/k8s-kubectl:latest
          command:
            - sh
            - -c
            - |
              set -eu
              if kubectl get secret mint-box-tls -n gross-view >/dev/null 2>&1; then
                echo "mint-box-tls already exists - skipping self-signed bootstrap"
                exit 0
              fi
              kubectl create secret tls mint-box-tls \
                --cert=/shared/tls.crt --key=/shared/tls.key \
                -n gross-view
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: tls-bootstrap
              mountPath: /shared
      containers:
        - name: nginx
          image: dockerhub.timeweb.cloud/library/nginx:stable-alpine
          ports:
            - name: http
              containerPort: 80
              # The Timeweb LoadBalancer health-checks the backend node on
              # 192.168.132.5:80 (HTTP GET /, not the NodePort) and drops the
              # backend if it gets a non-2xx/RST. hostPort makes node:80 reach
              # nginx, whose `location /` returns 200 for the health check.
              hostPort: 80
            - name: https
              containerPort: 443
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/certs
              readOnly: true
            - name: certbot-data
              mountPath: /var/www/certbot
          readinessProbe:
            httpGet:
              # /healthz is served by nginx itself (200), independent of the
              # backend Services (mint-box.conf returns a 301 on / elsewhere)
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: tls
          secret:
            secretName: mint-box-tls
        - name: certbot-data
          persistentVolumeClaim:
            claimName: certbot-data
        - name: tls-bootstrap
          emptyDir: {}