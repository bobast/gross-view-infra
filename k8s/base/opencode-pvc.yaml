apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencode-data
  namespace: gross-view
  labels:
    app.kubernetes.io/name: opencode
    app.kubernetes.io/part-of: gross-view
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
