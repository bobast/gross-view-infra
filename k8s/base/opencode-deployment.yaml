# opencode - Deployment
# AI coding agent (web UI mode).
# Uses file-based storage (no DB needed), PersistentVolume for config/sessions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: gross-view
  labels:
    app.kubernetes.io/name: opencode
    app.kubernetes.io/part-of: gross-view
spec:
  replicas: 1
  # Keep no old ReplicaSets: obsolete revisions for nonexistent pods are cleaned up.
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: opencode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencode
        app.kubernetes.io/part-of: gross-view
    spec:
      containers:
        - name: opencode
          image: ghcr.io/anomalyco/opencode:latest
          command: ["/bin/sh", "/entrypoint.sh"]
          env:
            # No server-side auth: the handler→opencode direction passes the real
            # user's JWT (attribution), not Basic auth — the server runs on the internal
            # network without its own credentials (gross-view-handler change).
            # MCP servers are NOT configured statically: for each session the handler
            # registers an isolated server (gross-view-<ws>-<userHash>-<sessionHash>)
            # via POST /mcp (Authorization: Bearer <mcp-jwt> + X-Workspace-Id) and
            # tears it down with DELETE /mcp on session end. The static shared OAuth
            # server (OPENCODE_MCP_URL/CLIENT_ID/SCOPE) was removed 2026-09-24.
            - name: BROWSER
              value: "none"
            # LLM provider keys; the opencode server reads them directly as provider
            # credentials (matches docker-compose <PROVIDER>_API_KEY passthrough).
            - name: DEEPSEEK_API_KEY
              valueFrom: { secretKeyRef: { name: gross-view-secrets, key: deepseek_api_key } }
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: gross-view-secrets, key: openai_api_key } }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: gross-view-secrets, key: anthropic_api_key } }
            - name: OPENROUTER_API_KEY
              valueFrom: { secretKeyRef: { name: gross-view-secrets, key: openrouter_api_key } }
            - name: GOOGLE_API_KEY
              valueFrom: { secretKeyRef: { name: gross-view-secrets, key: google_api_key } }
            - name: GROQ_API_KEY
              valueFrom: { secretKeyRef: { name: gross-view-secrets, key: groq_api_key } }
            - name: MISTRAL_API_KEY
              valueFrom: { secretKeyRef: { name: gross-view-secrets, key: mistral_api_key } }
            - name: XAI_API_KEY
              valueFrom: { secretKeyRef: { name: gross-view-secrets, key: xai_api_key } }
          ports:
            - name: http
              containerPort: 4096
          volumeMounts:
            - name: opencode-data
              mountPath: /root/.config/opencode
            # opencode runtime data (~/.local/share/opencode: sleep data, models, optional
            # local-CLI mcp-auth.json) — must be persisted on the same PVC to survive restarts.
            - name: opencode-data
              mountPath: /root/.local/share/opencode
            - name: opencode-entrypoint
              mountPath: /entrypoint.sh
              subPath: entrypoint.sh
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 150m
              memory: 256Mi
      volumes:
        - name: opencode-data
          persistentVolumeClaim:
            claimName: opencode-data
        - name: opencode-entrypoint
          configMap:
            name: opencode-entrypoint
            defaultMode: 0555
