# opencode - Deployment
# AI coding agent (web UI mode).
# Uses file-based storage (no DB needed), PersistentVolume for config/sessions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: gross-view
  labels:
    app.kubernetes.io/name: opencode
    app.kubernetes.io/part-of: gross-view
spec:
  replicas: 1
  # Keep no old ReplicaSets: obsolete revisions for nonexistent pods are cleaned up.
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: opencode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencode
        app.kubernetes.io/part-of: gross-view
    spec:
      containers:
        - name: opencode
          image: ghcr.io/anomalyco/opencode:latest
          command: ["/bin/sh", "/entrypoint.sh"]
          env:
            # No server-side auth: the handler→opencode direction passes the real
            # user's JWT (attribution), not Basic auth — the server runs on the internal
            # network without its own credentials (gross-view-handler change).
            - name: BROWSER
              value: "none"
            - name: OPENCODE_MCP_URL
              value: "http://gross-view-api.gross-view.svc.cluster.local:8082/api/mcp"
            # Pre-registered Keycloak public client for MCP OAuth (RFC 9728) as the real user.
            - name: OPENCODE_MCP_CLIENT_ID
              value: "opencode-mcp"
          ports:
            - name: http
              containerPort: 4096
          volumeMounts:
            - name: opencode-data
              mountPath: /root/.config/opencode
            # OAuth tokens for the gross-view MCP server live in mcp-auth.json under
            # ~/.local/share/opencode — must be persisted on the same PVC to survive restarts.
            - name: opencode-data
              mountPath: /root/.local/share/opencode
            - name: opencode-entrypoint
              mountPath: /entrypoint.sh
              subPath: entrypoint.sh
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 150m
              memory: 256Mi
      volumes:
        - name: opencode-data
          persistentVolumeClaim:
            claimName: opencode-data
        - name: opencode-entrypoint
          configMap:
            name: opencode-entrypoint
            defaultMode: 0555
