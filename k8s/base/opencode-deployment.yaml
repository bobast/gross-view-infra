# opencode - Deployment
# Replaces n8n: AI coding agent (web UI mode).
# Uses file-based storage (no DB needed), PersistentVolume for config/sessions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: gross-view
  labels:
    app.kubernetes.io/name: opencode
    app.kubernetes.io/part-of: gross-view
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opencode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencode
        app.kubernetes.io/part-of: gross-view
    spec:
      containers:
        - name: opencode
          image: ghcr.io/anomalyco/opencode:latest
          command: ["web", "--port", "4096", "--hostname", "0.0.0.0"]
          env:
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom: { secretKeyRef: { name: gross-view-secrets, key: opencode_password } }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: gross-view-secrets, key: anthropic_api_key } }
            - name: BROWSER
              value: "none"
          ports:
            - name: http
              containerPort: 4096
          volumeMounts:
            - name: opencode-data
              mountPath: /root/.config/opencode
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 150m
              memory: 256Mi
      volumes:
        - name: opencode-data
          persistentVolumeClaim:
            claimName: opencode-data
