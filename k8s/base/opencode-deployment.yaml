# opencode - Deployment
# Replaces n8n: AI coding agent (web UI mode).
# Uses file-based storage (no DB needed), PersistentVolume for config/sessions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: gross-view
  labels:
    app.kubernetes.io/name: opencode
    app.kubernetes.io/part-of: gross-view
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opencode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencode
        app.kubernetes.io/part-of: gross-view
    spec:
      containers:
        - name: opencode
          image: ghcr.io/anomalyco/opencode:latest
          command: ["/bin/sh", "/entrypoint.sh"]
          env:
            - name: DEEPSEEK_API_KEY
              valueFrom: { secretKeyRef: { name: gross-view-secrets, key: deepseek_api_key } }
            - name: OPENCODE_SERVER_USERNAME
              valueFrom: { secretKeyRef: { name: gross-view-secrets, key: opencode_server_username } }
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom: { secretKeyRef: { name: gross-view-secrets, key: opencode_server_password } }
            - name: BROWSER
              value: "none"
            - name: OPENCODE_MCP_URL
              value: "http://gross-view-api.gross-view.svc.cluster.local:8082/api/mcp"
            - name: OPENCODE_MCP_TOKEN
              valueFrom: { secretKeyRef: { name: gross-view-secrets, key: opencode_mcp_token, optional: true } }
            - name: KEYCLOAK_INTERNAL_URL
              valueFrom: { secretKeyRef: { name: gross-view-secrets, key: keycloak_internal_url } }
            - name: OPENCODE_AGENT_CLIENT_ID
              valueFrom: { secretKeyRef: { name: gross-view-secrets, key: opencode_agent_client_id } }
            - name: OPENCODE_AGENT_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: gross-view-secrets, key: opencode_agent_client_secret } }
          ports:
            - name: http
              containerPort: 4096
          volumeMounts:
            - name: opencode-data
              mountPath: /root/.config/opencode
            - name: opencode-entrypoint
              mountPath: /entrypoint.sh
              subPath: entrypoint.sh
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 150m
              memory: 256Mi
      volumes:
        - name: opencode-data
          persistentVolumeClaim:
            claimName: opencode-data
        - name: opencode-entrypoint
          configMap:
            name: opencode-entrypoint
            defaultMode: 0555
