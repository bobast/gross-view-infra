# Kustomize base for the gross-view infrastructure on Kubernetes.
# appends the Keycloak theme + realm ConfigMaps via the root kustomization.yaml.
# Apply with:  kubectl apply -k .
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gross-view

resources:
  - namespace.yaml
  - storageclass.yaml
  - secret.yaml
#  - postgres-init-configmap.yaml
#  - postgres-service.yaml
#  - postgres-statefulset.yaml
#  - keycloak-deployment.yaml
#  - keycloak-service.yaml
  - nginx-configmap.yaml
  - nginx-deployment.yaml
  - nginx-service.yaml
#  - opencode-deployment.yaml
#  - opencode-service.yaml
#  - opencode-pvc.yaml
#  - vault-configmap.yaml
#  - vault-service.yaml
#  - vault-statefulset.yaml
#  - wireguard-deployment.yaml
#  - wireguard-service.yaml
#  - wireguard-pvc.yaml
#  - dnsmasq-configmap.yaml
#  - dnsmasq-deployment.yaml
#  - dnsmasq-service.yaml
  - certbot-pvc.yaml
  - certbot-rbac.yaml
  - certbot-cronjob.yaml
  # tls-secret.yaml is NOT listed: the `mint-box-tls` Secret holds the real
  # Let's Encrypt cert once certbot has run, and is maintained by the certbot
  # CronJob. The static bootstrap placeholder (empty data) would invalidate the
  # Secret / clobber the real cert if applied via kustomize. To bootstrap a
  # fresh cluster before certbot runs, apply tls-secret.yaml manually first:
  #   kubectl apply -f k8s/base/tls-secret.yaml -n gross-view
  #   # or run: kubectl -n gross-view create job --from=cronjob/certbot certbot-bootstrap
  # ingress.yaml is intentionally NOT listed: the nginx Deployment + Service now
  # terminate TLS and are the entry point. Keep ingress.yaml for reference when
  # switching back to ingress-nginx (it would conflict on node ports 80/443).
