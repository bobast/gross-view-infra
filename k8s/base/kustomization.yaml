# Kustomize base for the gross-view infrastructure on Kubernetes.
# appends the Keycloak theme + realm ConfigMaps via the root kustomization.yaml.
# Apply with:  kubectl apply -k .
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gross-view

resources:
  - namespace.yaml
  - storageclass.yaml
  - postgres-init-configmap.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - keycloak-deployment.yaml
  - keycloak-service.yaml
  - nginx-configmap.yaml
  - nginx-deployment.yaml
  - nginx-service.yaml
  - gross-view-ui-deployment.yaml
  - gross-view-ui-service.yaml
  - vault-sa.yaml
  - vault-pvc.yaml
  - vault-deployment.yaml
  - vault-service.yaml
  - vault-entrypoint-configmap.yaml
  # ESO (external-secrets operator) integration with Vault. The operator itself
  # is installed out-of-band (release bundle) into namespace `external-secrets`;
  # here live the provider config (ClusterSecretStore) and the secret source
  # (ExternalSecret backing `gross-view-secrets` from Vault path secret/gross-view).
  - eso-clustersecretstore.yaml
  - eso-externalsecret.yaml
  # VPN gateway (WireGuard + nginx stream proxy) — the only developer entry point to
  # postgres/vault from outside the cluster; see docs/vpn-access-k8s.md.
  # Its Secret `vpn-gateway-keys` is deliberately NOT here: key material never lives
  # in git. Create it with ./scripts/vpn-init.sh (server keys) and maintain peers with
  # ./scripts/vpn-peer.sh. Until it exists the pods stay Pending on the missing Secret.
  - vpn-gateway-entrypoint-configmap.yaml
  # nginx stream proxy of the gateway pod (10.2.2.3:15432 -> postgres,
  # 10.2.2.3:18200 -> vault; wg0 address since 2026-10-09). Removed 2026-10-07, restored 2026-10-08 from
  # docs/vpn-access-k8s.md §12 (the file was never committed before the removal).
  - vpn-gateway-proxy-configmap.yaml
  - vpn-gateway-deployment.yaml
#  - opencode-deployment.yaml
#  - opencode-service.yaml
#  - opencode-pvc.yaml
  - certbot-pvc.yaml
  - certbot-rbac.yaml
  - certbot-cronjob.yaml
  - nginx-tls-bootstrap-rbac.yaml
  # There is NO secret.yaml: `gross-view-secrets` is managed purely by the
  # ExternalSecret (owner-created from Vault secret/data/gross-view, which the
  # vault entrypoint seeds with dev placeholders on a fresh cluster).
  # There is also NO tls-secret.yaml: the `mint-box-tls` Secret lives only in
  # the cluster. If it does not exist, the nginx Deployment's initContainer
  # generates a throwaway self-signed cert and creates it; the certbot CronJob
  # then replaces it with the real Let's Encrypt certificate.
  # ingress.yaml is intentionally NOT listed: the nginx Deployment + Service now
  # terminate TLS and are the entry point. Keep ingress.yaml for reference when
  # switching back to ingress-nginx (it would conflict on node ports 80/443).
