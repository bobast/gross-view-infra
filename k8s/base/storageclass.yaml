# Default StorageClass for clusters that don't provide one (e.g. bare k3s/kind).
# Adjust provisioner/reclaimPolicy to match your environment.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: standard
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
