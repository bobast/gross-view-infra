# nginx - reverse proxy ConfigMap.
# Mirrors nginx/gross-view.local.conf for the production domain mint-box.ru.
# TLS is terminated here: certificates come from the `mint-box-tls` Secret,
# which the certbot CronJob keeps up to date via Let's Encrypt HTTP-01.
# HTTP-01 challenge files are served from the shared `certbot-data` PVC at
# /var/www/certbot (webroot). Port 80 block carries the ACME location because
# a server-level `return 301` would otherwise shadow the challenge path.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: gross-view
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: gross-view
data:
  mint-box.conf: |
    server {
        listen 80;
        server_name mint-box.ru www.mint-box.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name mint-box.ru www.mint-box.ru;

        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Keycloak SSO
        location /sso/ {
            proxy_pass http://keycloak:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/.well-known/(oauth-authorization-server|openid-configuration)/sso/(.+)$ {
            rewrite ^/.well-known/[^/]+/sso/(.+)$ /$1/.well-known/openid-configuration break;
            proxy_pass http://keycloak:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API (gross-view-ui repo -> gross-view-api Service)
        location ~ ^/api/(.+)$ {
            proxy_pass http://gross-view-api:8082;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend (gross-view-ui Service, WebSocket support)
        location / {
            proxy_pass http://gross-view-ui:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }