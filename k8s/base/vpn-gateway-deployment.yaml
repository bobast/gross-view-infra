# VPN gateway: WireGuard server in a pod (with a render init container). This is
# the only way into the internal services of a cluster for a developer outside it —
# see docs/vpn-access-k8s.md for the design and rollout.
#
# Topology:
#   laptop --WireGuard/UDP 43210--> public IP of worker-192.168.132.5 (hostPort)
#        --> wg0 10.13.13.1 in this pod
#
# NOTE (2026-10-07, restored 2026-10-08): the nginx stream proxy container (and
# its ConfigMap `vpn-gateway-proxy`, listeners 10.13.13.1:15432 -> postgres /
# :18200 -> vault) was removed on 2026-10-07 and restored verbatim from
# docs/vpn-access-k8s.md §12. The proxy is the only thing that serves the two
# developer-facing ports inside the tunnel; it shares the pod netns so it can
# bind the wg0 address directly.
#
# Design constraints that shaped this manifest:
#   * hostPort (not a Service): the Timeweb load balancer only speaks TCP
#     (proto-http/https/tcp/tcp-ssl/http2), WireGuard needs UDP. Inbound UDP to the
#     node's public IP was verified live on 2026-10-05 (hostPort 43210/udp probe).
#   * NET_ADMIN only, no privileged and no hostNetwork: creating a WireGuard
#     interface works with NET_ADMIN alone (verified). A host-network WireGuard
#     would instead have to punch holes in Calico's host FORWARD chain.
#   * No IP forwarding anywhere: clients only route 10.13.13.1/32, so pod and
#     service CIDRs never enter the tunnel, and nothing is routed through this pod.
#     (/proc/sys is read-only in a pod netns unless the pod is privileged — another
#     reason not to go the "route the whole cluster CIDR" way.)
#   * Keys come from the Secret `vpn-gateway-keys`, created by scripts/vpn-init.sh
#     and updated per developer by scripts/vpn-peer.sh. This repo holds no secrets.
#   * The WireGuard image is linuxserver/wireguard in CLIENT mode (no `PEERS`
#     env): an init container renders /config/wg_confs/wg0.conf from the Secret,
#     and the image's own service brings the tunnel up with `wg-quick up` (which
#     also installs the peer AllowedIPs routes). Verified live 2026-10-06 in a
#     namespace boot test: no sysctl / iptables calls happen for a config whose
#     AllowedIPs contain no default route, so the read-only /proc/sys of a pod
#     is never touched.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpn-gateway
  namespace: gross-view
  labels:
    app.kubernetes.io/name: vpn-gateway
    app.kubernetes.io/part-of: gross-view
spec:
  replicas: 1
  # Same convention as the other Deployments in this repo: no old ReplicaSets.
  revisionHistoryLimit: 0
  # Recreate instead of the default RollingUpdate: the pod holds hostPort on a
  # single-node cluster, so a surge pod can never schedule while the old one is
  # still running — a RollingUpdate would wedge forever (0/1 Unschedulable, the
  # old pod only goes away when the new one is Ready). Recreate frees the host
  # port first, then starts the new pod, so `kubectl apply -k .` after any
  # pod-template change (see the peer-keys annotation below) actually rebuilds
  # the pod instead of deadlocking.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vpn-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vpn-gateway
        app.kubernetes.io/part-of: gross-view
      annotations:
        # Peer keys live only in the Secret `vpn-gateway-keys` (never in git) and
        # the entrypoint reads them once at pod start — so after a peer re-key the
        # pod must be rebuilt. Public keys are not secret, so the current peer set
        # is mirrored here as the rebuild trigger: when it changes, commit the
        # manifest and `kubectl apply -k .` recreates the pod (strategy Recreate
        # above keeps that safe on a single node). Do NOT put private keys
        # here — only `name=<peer public key>` entries.
        vpn.gross-view/peer-publickeys: "GW=ojD0T517girSt/rWvkmbi1LtJb6wGBd+c9RnJVZm+XY="
    spec:
      # Group 101 = user `nginx` of the nginx:stable-alpine image, so the emptyDirs
      # of the proxy container are writable for it (both containers share the pod's
      # volumes; the wireguard container runs as root and is unaffected).
      securityContext:
        fsGroup: 101
      # Phase 1: render the tunnel config from Secret vpn-gateway-keys into the
      # shared emptyDir. Runs before the wireguard container (whose image then
      # does `wg-quick up /config/wg_confs/wg0.conf`), so key material never
      # lives in the image's own storage and peer changes only need a pod rebuild.
      initContainers:
        - name: render-config
          image: dockerhub.timeweb.cloud/linuxserver/wireguard:latest
          command: ["/vpn/entrypoint.sh"]
          env:
            - name: WG_IF
              value: wg0
            - name: WG_LISTEN_PORT
              value: "43210"
            # Server address + tunnel network. 10.13.13.0/24 matches the legacy
            # `wg_internal_subnet` value already stored in Vault, so the docker-compose
            # side (gross-view-handler's own WireGuard server) stays compatible.
            - name: WG_SERVER_ADDRESS
              value: "10.13.13.1/24"
            - name: WG_MTU
              value: "1380"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: vpn-entrypoint
              mountPath: /vpn/entrypoint.sh
              subPath: entrypoint.sh
              readOnly: true
            - name: vpn-keys
              mountPath: /run/vpn-keys
              readOnly: true
            - name: vpn-config
              mountPath: /config
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: wireguard
          image: dockerhub.timeweb.cloud/linuxserver/wireguard:latest
          # No command: /init (s6-overlay) runs the image as-is. The image must
          # stay in client mode — PEERS must NOT be set (its own key generation
          # would fight the vpn-gateway-keys Secret and be lost in the emptyDir).
          env:
            # PUID/PGID default to 911; /config is chowned to abc by the image.
            - name: PUID
              value: "911"
            - name: PGID
              value: "911"
          ports:
            - name: wireguard
              containerPort: 43210
              hostPort: 43210
              protocol: UDP
          securityContext:
            # wg-quick needs NET_ADMIN (ip link / ip route / wg). CHOWN + DAC_OVERRIDE
            # are for the image's own init: `lsiown -R abc:abc /config` (chown of the
            # rendered conf) and root reading the 0600 conf afterwards. No privileged,
            # no SYS_MODULE (the wireguard module is already loaded on the host —
            # the image's module check only probes with `ip link add type wireguard`),
            # no NET_RAW/NF hooks: wg-quick only touches iptables/sysctl for a
            # default-route (*/0) AllowedIPs, which this config never has.
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - CHOWN
                - DAC_OVERRIDE
          volumeMounts:
            # Shared with the init container: the renderer writes
            # /config/wg_confs/wg0.conf here, the image's svc-wireguard consumes it.
            - name: vpn-config
              mountPath: /config
          # The tunnel is the pod's reason to exist: wg show fails while the
          # interface is missing, so a lost wg0 restarts the container (the image
          # re-runs wg-quick up on boot) instead of the old in-process supervision
          # loop. Generous startup window covers s6 init + module probe.
          startupProbe:
            exec:
              command: ["wg", "show", "wg0"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["wg", "show", "wg0"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              # Higher than the old alpine container (128Mi): the image runs a full
              # s6-overlay + bash stack, whose resident memory is larger than a
              # BusyBox loop. Watch the pod if raising further — the node has 2GB.
              memory: 192Mi
        # nginx stream proxy: publishes the two VPN-only ports on the wg0 address
        # (postgres 15432, vault 18200). Both containers share the pod network
        # namespace, but they start in parallel: wait for wg0 to carry 10.13.13.1,
        # otherwise nginx fails to bind the stream listen address and exits.
        - name: proxy
          image: dockerhub.timeweb.cloud/library/nginx:stable-alpine
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "[vpn-proxy] waiting for wg0 (10.13.13.1)..."
              until ip -o -4 address show dev wg0 2>/dev/null | grep -q '10\.13\.13\.1/'; do
                sleep 1
              done
              echo "[vpn-proxy] wg0 is up, starting nginx stream proxy"
              exec nginx -g 'daemon off;'
          volumeMounts:
            - name: vpn-proxy
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: proxy-logs
              mountPath: /var/log/nginx
            - name: proxy-cache
              mountPath: /var/cache/nginx
            - name: proxy-run
              mountPath: /var/run
          # BusyBox nc is used with a plain connect+close (no -z): the flag set differs
          # between busybox and other nc builds, and this form works with both.
          readinessProbe:
            exec:
              command: ["sh", "-c", "nc -w 2 10.13.13.1 15432 </dev/null >/dev/null 2>&1"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: vpn-entrypoint
          configMap:
            name: vpn-gateway-entrypoint
            defaultMode: 0555
        - name: vpn-keys
          secret:
            secretName: vpn-gateway-keys
        # Pod-level share between the render init container and the wireguard
        # container (/config of the image). The image's own init chowns it to
        # abc:abc (911) — that is why the main container keeps CHOWN/DAC_OVERRIDE.
        - name: vpn-config
          emptyDir: {}
        # nginx stream proxy (container `proxy`): config from the ConfigMap
        # `vpn-gateway-proxy` + writable log/cache/run dirs.
        - name: vpn-proxy
          configMap:
            name: vpn-gateway-proxy
            defaultMode: 0444
        - name: proxy-logs
          emptyDir: {}
        - name: proxy-cache
          emptyDir: {}
        - name: proxy-run
          emptyDir: {}