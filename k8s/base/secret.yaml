# Kubernetes Secret for gross-view stack.
# NOTE: Values below are placeholders. Fill them before applying (kubectl apply -k).
# Do not commit real secrets to git. For production, manage via ExternalSecrets/Vault.
apiVersion: v1
kind: Secret
metadata:
  name: gross-view-secrets
  namespace: gross-view
  labels:
    app.kubernetes.io/part-of: gross-view
type: Opaque
stringData:
  # Postgres superuser (matches docker-compose POSTGRES_*)
  postgres_user: change_me
  postgres_password: change_me
  postgres_db: postgres

  # Keycloak database (KC_*)
  kc_db_user: change_me
  kc_db_password: change_me
  kc_db_name: keycloak

  # Gross-view application database (GV_*)
  gv_db_user: change_me
  gv_db_password: change_me
  gv_db_name: gross_view

  # n8n
  n8n_db_user: change_me
  n8n_db_password: change_me
  n8n_db_name: n8n

  # Keycloak encryption
  n8n_encryption_key: change_me

  # Keycloak admin
  keycloak_admin: change_me
  keycloak_admin_password: change_me

  # WireGuard
  wg_serverurl: auto
  wg_peers: "5"
  wg_peer_dns: 172.28.0.8
  wg_internal_subnet: 10.13.13.0

  # opencode AI agent
  deepseek_api_key: change_me

  # opencode HTTP Basic auth (server). Must match OPENCODE_SERVER_PASSWORD on the
  # gross-view-handler side (opencode.api.password) and gross-view-infra/.env.
  opencode_server_username: opencode
  opencode_server_password: change_me
