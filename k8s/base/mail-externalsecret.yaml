# Mail-specific credentials, sourced from Vault KV v2 path `secret/mail`
# (data/mail). Kept separate from `gross-view-secrets` so mailbox/admin
# passwords do not get pulled into every workload that reads the main Secret.
#
# The live cluster values were created with `vault kv put secret/mail ...`.
# A fresh cluster gets placeholders from vault/entrypoint.sh; replace them
# before using the mail service for real mail.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mail-secrets
  namespace: gross-view
  labels:
    app.kubernetes.io/name: mail
    app.kubernetes.io/part-of: gross-view
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gross-view-vault
    kind: ClusterSecretStore
  target:
    name: mail-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: admin_password
      remoteRef:
        key: mail
        property: admin_password
    - secretKey: noreply_password
      remoteRef:
        key: mail
        property: noreply_password
    - secretKey: pavlov_password
      remoteRef:
        key: mail
        property: pavlov_password
    - secretKey: recovery_admin
      remoteRef:
        key: mail
        property: recovery_admin
