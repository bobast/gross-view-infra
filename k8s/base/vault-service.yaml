# Vault - Service (internal, ClusterIP). ESO will reach it at
# http://vault.gross-view.svc.cluster.local:8200 (see docs/ESO-vault-k8s.md).
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: gross-view
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: gross-view
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vault
  ports:
    - name: http
      port: 8200
      targetPort: http