# tls - placeholder `mint-box-tls` Secret.
# Self-signed certificate so the nginx pod can start before certbot issues a
# real Let's Encrypt certificate. The certbot CronJob overwrites this Secret via
# `kubectl create secret tls ... --dry-run=client -o yaml | kubectl apply -f -`
# and rolls the nginx Deployment. Keep the Secret name `mint-box-tls` in sync
# with nginx-deployment.yaml (secretName) and certbot-cronjob.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: mint-box-tls
  namespace: gross-view
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: gross-view
type: kubernetes.io/tls
data:
  tls.crt:
  tls.key:
