# n8n - Deployment
# Mirrors docker-compose n8n service (uses postgres for its DB, PersistentVolume for data).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: gross-view
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: gross-view
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
        app.kubernetes.io/part-of: gross-view
    spec:
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n
          env:
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              value: postgres
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              valueFrom: { secretKeyRef: { name: gross-view-secrets, key: n8n_db_name } }
            - name: DB_POSTGRESDB_USER
              valueFrom: { secretKeyRef: { name: gross-view-secrets, key: n8n_db_user } }
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom: { secretKeyRef: { name: gross-view-secrets, key: n8n_db_password } }
            - name: N8N_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: gross-view-secrets, key: n8n_encryption_key } }
            - name: GENERIC_TIMEZONE
              value: Europe/Kyiv
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 5678
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
          # depends_on postgres: service_healthy -> pod must wait for DB readiness
          # StatefulSet 'postgres' has no readiness-gated scheduling, so use init check:
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - 'until pg_isready -h postgres -p 5432 -U "$DB_POSTGRESDB_USER" -d "$DB_POSTGRESDB_DATABASE"; do sleep 2; done'
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data
