services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    command: postgres -c shared_preload_libraries=timescaledb
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PSWD}
      KC_DB_NAME: ${KC_DB_NAME}
      KC_DB_USER: ${KC_DB_USER}
      KC_DB_PSWD: ${KC_DB_PSWD}
      GV_DB_NAME: ${GV_DB_NAME}
      GV_DB_USER: ${GV_DB_USER}
      GV_DB_PSWD: ${GV_DB_PSWD}
    networks:
      keycloak_network:
        ipv4_address: 172.28.0.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.6
    command: start --import-realm --features=token-exchange
    environment:
      KC_HOSTNAME_URL: https://gross-view.local/sso
      KC_HOSTNAME_ADMIN_URL: https://gross-view.local/sso
      KC_HOSTNAME_STRICT: true
      KC_HOSTNAME_STRICT_HTTPS: true
      KC_HOSTNAME_STRICT_BACKCHANNEL: false
      KC_HTTP_ENABLED: true
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PSWD}
    ports:
      - 8080:8080
    restart: always
    volumes:
      - ./themes:/opt/keycloak/themes
      - ./gross-view-realm.json:/opt/keycloak/data/import/gross-view-realm.json
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && { exec 3<&-; exec 3>&-; } && exit 0 || exit 1"]
      interval: 10s
      retries: 30
      start_period: 60s
      timeout: 5s
    depends_on:
      - postgres
    networks:
      keycloak_network:
        ipv4_address: 172.28.0.3

  nginx:
    image: nginx:stable-alpine
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/gross-view.local.conf:/etc/nginx/conf.d/gross-view.local.conf
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - keycloak
    networks:
      keycloak_network:
        ipv4_address: 172.28.0.4
    extra_hosts:
      - host.docker.internal:host-gateway

  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      # No server-side auth: the handler→opencode direction passes the real
      # user's JWT (attribution), not Basic auth — the server runs on the internal
      # network without its own credentials (gross-view-handler change).
      # MCP-подключения НЕ настраиваются статично: для каждой сессии handler
      # регистрирует изолированный сервер gross-view-<ws>-<userHash>-<sessionHash>
      # через POST /mcp (Authorization: Bearer <mcp-jwt> + X-Workspace-Id) и снимает
      # его по DELETE /mcp при завершении сессии. Статичный общий OAuth-сервер
      # (OPENCODE_MCP_* envs) удалён 2026-09-24 — см. §9 docs/opencode-mcp-integration.md.
      BROWSER: "none"
      # LLM provider keys come from the environment (no auth.json / /connect needed):
      # the opencode server reads DEEPSEEK_API_KEY etc. directly as provider credentials.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # nginx terminates TLS for gross-view.local with a self-signed cert; the agent
      # must trust it to reach the handler's /api/mcp (per-session MCP registration).
      NODE_EXTRA_CA_CERTS: /etc/ssl/gross-view.local.crt
    volumes:
      - opencode_data:/root/.config/opencode
      - opencode_data:/root/.local/share/opencode
      - ./opencode/entrypoint.sh:/entrypoint.sh:ro
      # Self-signed nginx cert for gross-view.local (consumed via NODE_EXTRA_CA_CERTS).
      - ./certs/gross-view.local.crt:/etc/ssl/gross-view.local.crt:ro
    ports:
      - "4096:4096"
      # Opt-in local CLI debug: OAuth (RFC 9728) callback port used by a manual
      # `opencode mcp auth gross-view` run inside the container against the
      # pre-registered public client 'opencode-mcp'. The deployed agent opens NO
      # channels via OAuth (per-session MCP is registered by the handler), so this
      # mapping is optional — kept for debugging only.
      - "127.0.0.1:19876:19876"
    restart: always
    extra_hosts:
      # gross-view.local must resolve to the nginx proxy (TLS termination): inside the
      # container the name otherwise hits its own loopback (127.0.0.1) and the
      # per-session MCP endpoint https://gross-view.local/api/mcp becomes unreachable.
      - gross-view.local:172.28.0.4
      - host.docker.internal:host-gateway
    networks:
      keycloak_network:
        ipv4_address: 172.28.0.5

  vault:
    image: hashicorp/vault:1.18.4
    entrypoint: ["/bin/sh", "/vault/entrypoint.sh"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_CONFIG_FILE: /vault/config/vault-config.hcl
      VAULT_DATA_DIR: /vault/data
      # Kubernetes-auth role config (used only inside a real pod; inert in docker).
      ESO_ROLE_NAME: eso-role
      ESO_BOUND_SA_NAME: eso-vault-auth
      ESO_BOUND_SA_NAMESPACE: gross-view
    volumes:
      # Auto-start bootstrap: init on first boot, auto-unseal on every boot.
      - ./vault/entrypoint.sh:/vault/entrypoint.sh:ro
      - ./vault/vault-config.hcl:/vault/config/vault-config.hcl:ro
      # init.json (unseal key + root token) persists here; keep the volume safe.
      - vault_data:/vault/data
    networks:
      keycloak_network:
        ipv4_address: 172.28.0.6
    restart: always
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

volumes:
  postgres_data:
    driver: local
  opencode_data:
    driver: local
  vault_data:
    driver: local

networks:
  keycloak_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
