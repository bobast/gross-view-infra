services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    command: postgres -c shared_preload_libraries=timescaledb
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PSWD}
      KC_DB_NAME: ${KC_DB_NAME}
      KC_DB_USER: ${KC_DB_USER}
      KC_DB_PSWD: ${KC_DB_PSWD}
      GV_DB_NAME: ${GV_DB_NAME}
      GV_DB_USER: ${GV_DB_USER}
      GV_DB_PSWD: ${GV_DB_PSWD}
    networks:
      keycloak_network:
        ipv4_address: 172.28.0.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.6
    command: start --import-realm
    environment:
      KC_HOSTNAME_URL: https://gross-view.local/sso
      KC_HOSTNAME_ADMIN_URL: https://gross-view.local/sso
      KC_HOSTNAME_STRICT: true
      KC_HOSTNAME_STRICT_HTTPS: true
      KC_HOSTNAME_STRICT_BACKCHANNEL: false
      KC_HTTP_ENABLED: true
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PSWD}
    ports:
      - 8080:8080
    restart: always
    volumes:
      - ./themes:/opt/keycloak/themes
      - ./gross-view-realm.json:/opt/keycloak/data/import/gross-view-realm.json
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && { exec 3<&-; exec 3>&-; } && exit 0 || exit 1"]
      interval: 10s
      retries: 30
      start_period: 60s
      timeout: 5s
    depends_on:
      - postgres
    networks:
      keycloak_network:
        ipv4_address: 172.28.0.3

  nginx:
    image: nginx:stable-alpine
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/gross-view.local.conf:/etc/nginx/conf.d/gross-view.local.conf
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - keycloak
    networks:
      keycloak_network:
        ipv4_address: 172.28.0.4
    extra_hosts:
      - host.docker.internal:host-gateway

  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      BROWSER: "none"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      OPENCODE_SERVER_USERNAME: opencode
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-${OPENCODE_PASSWORD:-}}
      OPENCODE_MCP_URL: ${OPENCODE_MCP_URL:-http://host.docker.internal:8082/api/mcp}
      OPENCODE_MCP_TOKEN: ${OPENCODE_MCP_TOKEN:-}
      # Auto-generate MCP token from Keycloak if OPENCODE_MCP_TOKEN is empty.
      # KEYCLOAK_INTERNAL_URL: in-network plain-HTTP endpoint used by the entrypoint
      # (busybox wget has no TLS); KEYCLOAK_URL stays the public HTTPS fallback.
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      OPENCODE_AGENT_CLIENT_ID: ${OPENCODE_AGENT_CLIENT_ID:-opencode-agent}
      OPENCODE_AGENT_CLIENT_SECRET: ${OPENCODE_AGENT_CLIENT_SECRET:-}
    volumes:
      - opencode_data:/root/.config/opencode
      - ./opencode/entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "4096:4096"
    restart: always
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      keycloak_network:
        ipv4_address: 172.28.0.5

volumes:
  postgres_data:
    driver: local
  opencode_data:
    driver: local
  wireguard_config:
    driver: local
  vault_data:
    driver: local

networks:
  keycloak_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
