services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    command: postgres -c shared_preload_libraries=timescaledb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PSWD}
      KC_DB_NAME: ${KC_DB_NAME}
      KC_DB_USER: ${KC_DB_USER}
      KC_DB_PSWD: ${KC_DB_PSWD}
      GV_DB_NAME: ${GV_DB_NAME}
      GV_DB_USER: ${GV_DB_USER}
      GV_DB_PSWD: ${GV_DB_PSWD}
      N8N_DB_NAME: ${N8N_DB_NAME}
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PSWD: ${N8N_DB_PSWD}
    networks:
      keycloak_network:
        ipv4_address: 172.28.0.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.6
    command: start --import-realm
    environment:
      KC_HOSTNAME_URL: https://gross-view.local/sso
      KC_HOSTNAME_ADMIN_URL: https://gross-view.local/sso
      KC_HOSTNAME_STRICT: true
      KC_HOSTNAME_STRICT_HTTPS: true
      KC_HOSTNAME_STRICT_BACKCHANNEL: false
      KC_HTTP_ENABLED: true
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PSWD}
    restart: always
    volumes:
      - ./themes:/opt/keycloak/themes
      - ./gross-view-realm.json:/opt/keycloak/data/import/gross-view-realm.json
    depends_on:
      - postgres
    networks:
      keycloak_network:
        ipv4_address: 172.28.0.3

  nginx:
    image: nginx:stable-alpine
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/gross-view.local.conf:/etc/nginx/conf.d/gross-view.local.conf
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - keycloak
    networks:
      keycloak_network:
        ipv4_address: 172.28.0.4
    extra_hosts:
      - host.docker.internal:host-gateway

  n8n:
    image: docker.n8n.io/n8nio/n8n
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PSWD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      N8N_DIAGNOSTICS_ENABLED: false
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      keycloak_network:
        ipv4_address: 172.28.0.5

  tailscale:
    image: tailscale/tailscale:latest
    hostname: gross-view-vpn
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--advertise-exit-node --accept-routes
    networks:
      keycloak_network:
        ipv4_address: 172.28.0.6
    restart: always

  vault:
    image: hashicorp/vault:latest
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/data
      - ./vault/config:/vault/config
    command: vault server -config=/vault/config/vault.hcl
    networks:
      keycloak_network:
        ipv4_address: 172.28.0.7
    restart: always

  dns:
    image: jpillora/dnsmasq:latest
    volumes:
      - ./dns/dnsmasq.conf:/etc/dnsmasq.conf:ro
    networks:
      keycloak_network:
        ipv4_address: 172.28.0.8
    restart: always

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local
  tailscale_state:
    driver: local
  vault_data:
    driver: local

networks:
  keycloak_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
