# dnsmasq configuration for gross-view infrastructure

# Listen on all interfaces
listen-address=0.0.0.0

# Bind only to specified interfaces
bind-interfaces

# Cache size (number of entries)
cache-size=1000

# Logging for debugging (disable in production)
log-queries
log-facility=/var/log/dnsmasq.log

# Upstream DNS servers
server=8.8.8.8
server=8.8.4.4

# Don't read /etc/resolv.conf - we handle everything
no-resolv

# Don't forward plain names (without dots)
domain-needed

# Don't forward reverse lookups for private IP ranges
bogus-priv

# Local domain
local=/local/
domain=local

# === Static hostname mappings (matching static IPs in docker-compose.yml) ===
address=/postgres/local/172.28.0.2
address=/keycloak/local/172.28.0.3
address=/nginx/local/172.28.0.4
address=/n8n/local/172.28.0.5
address=/wireguard/local/172.28.0.6
address=/vault/local/172.28.0.7
address=/dns/local/172.28.0.8

# === Service aliases ===
address=/db.local/172.28.0.2
address=/auth.local/172.28.0.3
address=/proxy.local/172.28.0.4
address=/workflow.local/172.28.0.5
address=/vpn.local/172.28.0.6
address=/secrets.local/172.28.0.7

# === Short names (no domain suffix) ===
address=/postgres/172.28.0.2
address=/keycloak/172.28.0.3
address=/nginx/172.28.0.4
address=/n8n/172.28.0.5
address=/wireguard/172.28.0.6
address=/vault/172.28.0.7
address=/dns/172.28.0.8