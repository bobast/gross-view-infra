server {
    listen 80;
    server_name gross-view.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gross-view.local;

    ssl_certificate /etc/nginx/certs/gross-view.local.crt;
    ssl_certificate_key /etc/nginx/certs/gross-view.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # keycloak is resolved AT REQUEST TIME via Docker's embedded DNS (127.0.0.11).
    # A static `proxy_pass http://keycloak:8080` is resolved while the config is
    # loaded, so nginx aborts with "host not found in upstream" whenever it starts
    # before the keycloak container is attached to the network, and it would keep a
    # stale IP after keycloak is recreated. Mirrors the resolver approach already
    # used in k8s/base/nginx-configmap.yaml. host.docker.internal below stays
    # static — it comes from extra_hosts (/etc/hosts) and is always resolvable.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $keycloak_upstream keycloak:8080;

    location /sso/ {
        # With a variable in proxy_pass nginx does NOT strip the location prefix,
        # so /sso/ is removed by the rewrite explicitly (rewrite ... break changes
        # $uri, which proxy_pass then sends as-is).
        rewrite ^/sso/(.*)$ /$1 break;
        proxy_pass http://$keycloak_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/.well-known/(oauth-authorization-server|openid-configuration)/sso/(.+)$ {
        rewrite ^/.well-known/[^/]+/sso/(.+)$ /$1/.well-known/openid-configuration break;
        proxy_pass http://$keycloak_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/(.+)$ {
        proxy_pass http://host.docker.internal:8082;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://host.docker.internal:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
