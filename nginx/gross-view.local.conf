# Публичный callback СБП: строгий лимит по IP и размеру тела.
# Zone-директивы должны находиться в http-контексте (этот файл включён в conf.d).
limit_req_zone $binary_remote_addr zone=sbp_cb:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=sbp_cb_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name gross-view.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gross-view.local;

    ssl_certificate /etc/nginx/certs/gross-view.local.crt;
    ssl_certificate_key /etc/nginx/certs/gross-view.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # The local stand authenticates against the PRODUCTION Keycloak
    # (https://mint-box.ru/sso, realm gross-view-realm), not the local container.
    #
    # This is a redirect, not a proxy: the production realm's public issuer is
    # https://mint-box.ru/sso/realms/..., and Keycloak renders absolute
    # mint-box.ru URLs into discovery documents and login pages, so a proxied
    # response would send the browser to the production host anyway. A redirect
    # also keeps the browser on the canonical issuer and avoids TLS/SNI and
    # cookie-domain mismatches. 307 (not 302) preserves the method and body for
    # any POST that still hits /sso (e.g. a cached token endpoint).
    #
    # The local `keycloak` container is kept as a realm/theme sandbox but is
    # no longer part of the site's auth path.
    location = /sso {
        return 307 https://mint-box.ru$request_uri;
    }

    location /sso/ {
        return 307 https://mint-box.ru$request_uri;
    }

    # RFC 8414/9728 discovery paths used by the MCP OAuth client. The
    # production nginx rewrites them to /realms/.../.well-known/openid-configuration,
    # so forward the original URI unchanged.
    location ~ ^/.well-known/(oauth-authorization-server|openid-configuration)/sso/(.+)$ {
        return 307 https://mint-box.ru$request_uri;
    }

    # Точный матч имеет приоритет над regex ^/api/(.+)$.
    # Callback банка: ограничение частоты по IP, размера тела и времени ответа.
    location = /api/sbp/callback {
        limit_req zone=sbp_cb burst=40 nodelay;
        limit_conn sbp_cb_conn 10;
        client_max_body_size 64k;

        proxy_pass http://host.docker.internal:8082;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/(.+)$ {
        proxy_pass http://host.docker.internal:8082;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://host.docker.internal:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
